name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Probe and check invariants
        run: ./run.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: results
          path: results/

  bench:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: benchmark-report-outofproc
            args: --filter "*" --exporters github
          - name: benchmark-report-inprocess
            args: --filter "*" --exporters github --inProcess
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: BenchmarkDotNet ${{ matrix.name }} (timings for information, not checked)
        run: dotnet run -c Release --project bench/AsyncBench -- ${{ matrix.args }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ matrix.name }}
          path: BenchmarkDotNet.Artifacts/results/
